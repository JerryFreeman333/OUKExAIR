<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070d18">
<meta name="description" content="温州市图灵人工智能高等研究院 · 创新社区数字大屏 — 成员成长、活动打卡、作品展示与实时大屏。">
<title>图灵研究院 · 创新社区大屏</title>
<link rel="icon" type="image/png" href="assets/img/brand/turing-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/cover.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/editorial.css">
</head>
<body class="is-locked">

<!-- ============ COVER ============ -->
<div class="cover" id="cover" role="button" tabindex="0" aria-label="进入图灵创新社区">
  <img class="cover-poster" src="assets/img/cover/air-poster.png" alt="OUKE AIR 主视觉海报" draggable="false">
  <div class="cover-status mono" aria-hidden="true"><i></i> DIRECT ACCESS / COMMUNITY ONLINE</div>
  <div class="cover-cta" aria-hidden="true">
    <span class="cover-cta-dot"></span>
    <strong>进入创新社区</strong>
    <span class="mono">ENTER COMMUNITY</span>
    <svg viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10"/></svg>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app" id="app" aria-hidden="true">
  <aside class="rail">
    <button class="rail-brand" data-nav="overview" aria-label="返回总览">
      <span class="brand-mark-crop" aria-hidden="true"><img src="assets/img/brand/turing-mark.png" alt=""></span><i></i>
    </button>
    <nav class="rail-nav" aria-label="主导航">
      <button class="rail-item active" data-nav="overview"><em class="rail-code">01</em><svg class="icon"><use href="#i-grid"/></svg><span>总览</span></button>
      <button class="rail-item" data-nav="ladder" title="成员成长天梯"><em class="rail-code">02</em><svg class="icon"><use href="#i-podium"/></svg><span>成长</span></button>
      <button class="rail-item" data-nav="events"><em class="rail-code">03</em><svg class="icon"><use href="#i-calendar"/></svg><span>活动</span></button>
      <button class="rail-item" data-nav="works"><em class="rail-code">04</em><svg class="icon"><use href="#i-layers"/></svg><span>作品</span></button>
    </nav>
    <div class="rail-bottom">
      <div class="rail-live" title="数据在线"><i></i><span>LIVE</span></div>
      <button class="rail-reset" id="reset-data" title="清空本机数据" aria-label="清空本机数据">
        <svg class="icon"><use href="#i-reset"/></svg>
      </button>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="wordmark">
        <span class="wordmark-emblem" aria-hidden="true"><img src="assets/img/brand/turing-mark.png" alt=""></span>
        <strong>图灵研究院</strong>
        <span class="mono">/ TURING AI · COMMUNITY</span>
        <sup>DEMO</sup>
      </div>
      <div class="topbar-mid mono" id="page-label">OVERVIEW / 社区总览</div>
      <div class="topbar-actions">
        <div class="clock mono" id="clock">00:00:00</div>
        <button class="btn btn-ghost btn-command" id="command-open" title="指令面板 (⌘K)">
          <svg class="icon"><use href="#i-bolt"/></svg><span>指令</span><kbd>⌘K</kbd>
        </button>
        <button class="btn btn-primary" id="checkin-open">
          <svg class="icon"><use href="#i-plus"/></svg> 登记 / 打卡
        </button>
      </div>
    </header>

    <main class="content" id="main">
      <section class="view" id="view-overview" data-view-panel="overview"></section>
      <section class="view" id="view-ladder" data-view-panel="ladder"></section>
      <section class="view" id="view-events" data-view-panel="events"></section>
      <section class="view" id="view-works" data-view-panel="works"></section>
    </main>

    <footer class="app-footer">
      <span>温州市图灵人工智能高等研究院 · 创新社区数字大屏</span>
      <span class="mono">LOCAL DATA / 本机存储 · DIRECT ACCESS · 2026</span>
    </footer>
  </div>
</div>

<div class="route-transition" id="route-transition" aria-hidden="true">
  <span class="route-panel route-panel-blue"></span>
  <span class="route-panel route-panel-orange"></span>
  <span class="route-label mono" id="route-transition-label">OVERVIEW</span>
</div>

<!-- command palette -->
<div class="command-backdrop" id="command" aria-hidden="true">
  <div class="command-panel" role="dialog" aria-modal="true" aria-labelledby="command-title">
    <div class="command-head">
      <span class="mono" id="command-title">TURING OS / COMMAND</span>
      <button class="command-close" id="command-close" aria-label="关闭指令面板"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="command-search">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="command-input" type="search" placeholder="搜索页面、成员或操作…" autocomplete="off">
      <kbd>ESC</kbd>
    </div>
    <div class="command-list" id="command-list"></div>
    <div class="command-foot mono"><span>↑↓ 移动</span><span>ENTER 执行</span><span>⌘K 开关</span></div>
  </div>
</div>

<!-- icons -->
<svg class="svg-defs" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
  <symbol id="i-podium" viewBox="0 0 24 24"><path d="M4 21h16M6 21v-6h5v6M13 21V9h5v12M9 15V4h5v11"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 14h2M14 14h2M8 18h2"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3-9 5 9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
  <symbol id="i-screen" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4M7 10l2-2 2 2 4-4 2 2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v12H3V8Z"/><circle cx="12" cy="14" r="4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 6 6L20 6"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 9-12h-7l1-8Z"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8M15 7h6v6"/></symbol>
</svg>

<!-- project / member modal -->
<div class="modal-backdrop" id="modal" aria-hidden="true">
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" id="modal-close" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- checkin modal -->
<div class="modal-backdrop" id="checkin" aria-hidden="true">
  <div class="modal-panel checkin-panel" role="dialog" aria-modal="true" aria-labelledby="checkin-title">
    <button class="modal-close" id="checkin-close" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button>
    <div id="checkin-content"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="confetti-layer" id="confetti" aria-hidden="true"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/mascots.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
